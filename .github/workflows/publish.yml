name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/saikit-learn/

    permissions:
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Flit
        run: python -m pip install flit

      - name: Build package
        run: |
          rm -rf dist/
          flit build

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
